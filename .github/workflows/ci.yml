# NativePHP compiles the Kotlin inside a consuming app, so on-device checks stay local.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pest
        run: ./vendor/bin/pest
